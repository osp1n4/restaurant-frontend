<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Nombre de Usuario</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1e293b;
            color: #e2e8f0;
        }
        .card {
            background: #334155;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #60a5fa;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #475569;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .success {
            background: #059669;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .error {
            background: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .info {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #3b82f6;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>👤 Actualizar Nombre de Usuario</h1>
        <p class="subtitle">Actualiza tu nombre de perfil en Firebase</p>
        
        <div class="info">
            <strong>Usuario actual:</strong> <span id="currentEmail">Cargando...</span>
            <br>
            <strong>Nombre actual:</strong> <span id="currentName">Cargando...</span>
        </div>
        
        <label for="displayName">Nuevo nombre completo:</label>
        <input 
            type="text" 
            id="displayName" 
            placeholder="Ej: Edwin Santiago"
            autocomplete="name"
        />
        
        <button onclick="updateDisplayName()" id="updateBtn">Actualizar Nombre</button>
        
        <div class="success" id="success">
            ✓ Nombre actualizado correctamente!
            <br><br>
            <span id="successMessage"></span>
        </div>
        
        <div class="error" id="error">
            ✗ Error al actualizar el nombre
            <br><br>
            <span id="errorMessage"></span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Configuración de Firebase (ajusta según tu proyecto)
        const firebaseConfig = {
            apiKey: "AIzaSyCxl0pVxhCICVmQ0R6P4p9dAM3yBZy6UXI",
            authDomain: "restaurantdb-edf63.firebaseapp.com",
            projectId: "restaurantdb-edf63",
            storageBucket: "restaurantdb-edf63.firebasestorage.app",
            messagingSenderId: "889302947640",
            appId: "1:889302947640:web:efa067d5b8cf0f54cb2bd4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('currentEmail').textContent = user.email || 'Sin email';
                document.getElementById('currentName').textContent = user.displayName || 'Sin nombre';
                document.getElementById('displayName').value = user.displayName || '';
            } else {
                document.getElementById('currentEmail').textContent = 'No autenticado';
                document.getElementById('currentName').textContent = 'No autenticado';
                document.getElementById('updateBtn').disabled = true;
                showError('Debes iniciar sesión primero');
            }
        });

        window.updateDisplayName = async function() {
            const displayName = document.getElementById('displayName').value.trim();
            
            if (!displayName) {
                showError('Por favor ingresa un nombre');
                return;
            }

            if (!currentUser) {
                showError('No hay usuario autenticado');
                return;
            }

            document.getElementById('updateBtn').disabled = true;
            document.getElementById('updateBtn').textContent = 'Actualizando...';
            hideMessages();

            try {
                await updateProfile(currentUser, { displayName });
                await currentUser.reload();
                
                document.getElementById('currentName').textContent = displayName;
                document.getElementById('successMessage').textContent = `Tu nombre ahora es: ${displayName}. Recarga la página de gestión de usuarios para ver el cambio.`;
                showSuccess();
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('errorMessage').textContent = error.message;
                showError();
            } finally {
                document.getElementById('updateBtn').disabled = false;
                document.getElementById('updateBtn').textContent = 'Actualizar Nombre';
            }
        }

        function showSuccess() {
            document.getElementById('success').style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('success').style.display = 'none';
            if (message) {
                document.getElementById('errorMessage').textContent = message;
            }
        }

        function hideMessages() {
            document.getElementById('success').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }
    </script>
</body>
</html>
